<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Soccer Multiplayer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
        }
        #score {
            font-size: 24px;
            margin-bottom: 10px;
        }
        #team {
            font-size: 18px;
            margin-bottom: 10px;
        }
        #controls {
            font-size: 14px;
            opacity: 0.8;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="ui">
        <div id="score">Team 1: 0 - Team 2: 0</div>
        <div id="team">Loading...</div>
        <div id="controls">
            W/↑: Acelerar<br>
            S/↓: Frenar<br>
            A/←: Izquierda<br>
            D/→: Derecha<br>
            SPACE: Boost
        </div>
    </div>
    <div id="loading">Conectando al servidor...</div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>
</html>
